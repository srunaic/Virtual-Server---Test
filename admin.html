<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Virtual Server</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Mobile Menu Toggle */
        .mobile-menu-toggle {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 10px;
        }

        /* Login Overlay */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-box {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--card-bg);
            border-right: 1px solid #334155;
            padding: 20px;
            display: none;
            /* 숨김 */
            flex-direction: column;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item {
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .nav-item:hover,
        .nav-item.active {
            background: var(--primary);
            color: white;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: none;
            /* 숨김 */
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #334155;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            margin: 10px 0;
        }

        /* Table */
        .user-table-container {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #334155;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 15px;
            color: #94a3b8;
            font-weight: 500;
            border-bottom: 1px solid #334155;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #334155;
        }

        .action-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Notice Modal (Simple) */
        .notice-section {
            display: none;
        }

        .active-section {
            display: block;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }

        button.btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        /* Mobile Overlay */
        .mobile-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        .mobile-overlay.show {
            display: block;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: -260px;
                width: 260px;
                height: 100vh;
                z-index: 1000;
                transition: left 0.3s ease;
                box-shadow: 2px 0 10px rgba(0, 0, 0, 0.3);
            }

            .sidebar.show {
                left: 0;
            }

            .main-content {
                margin-left: 0;
                width: 100%;
            }

            .mobile-menu-toggle {
                display: block;
            }

            .stats-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .stat-card {
                padding: 20px;
            }

            .stat-value {
                font-size: 1.8rem;
            }

            /* Mobile table styles */
            .user-table-container {
                overflow-x: auto;
            }

            table {
                min-width: 600px;
                font-size: 0.9rem;
            }

            th, td {
                padding: 12px 8px;
                white-space: nowrap;
            }

            /* Mobile card layout for user list */
            .mobile-user-cards {
                display: none;
            }

            @media (max-width: 768px) {
                .mobile-user-cards {
                    display: block;
                }

                .user-table-container table {
                    display: none;
                }

                .mobile-user-cards .user-card {
                    background: var(--card-bg);
                    border-radius: 12px;
                    padding: 15px;
                    margin-bottom: 10px;
                    border: 1px solid #334155;
                }

                .user-card-header {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    margin-bottom: 10px;
                }

                .user-card-info {
                    display: grid;
                    grid-template-columns: 1fr 1fr;
                    gap: 8px;
                    font-size: 0.9rem;
                }

                .user-card-info div {
                    display: flex;
                    justify-content: space-between;
                }

                .user-card-actions {
                    margin-top: 10px;
                    display: flex;
                    gap: 5px;
                }

                .user-card-actions button {
                    flex: 1;
                    padding: 8px;
                    font-size: 0.8rem;
                }
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .header h2 {
                margin: 0;
            }

            .stat-card input,
            .stat-card textarea {
                font-size: 16px; /* Prevent zoom on iOS */
            }

            .login-box {
                margin: 20px;
                max-width: none;
                width: calc(100% - 40px);
            }
        }

        @media (max-width: 480px) {
            .sidebar {
                width: 100%;
                left: -100%;
            }

            .stats-grid {
                padding: 0 10px;
            }

            .user-table-container {
                margin: 15px;
                padding: 15px;
            }

            .notice-section {
                padding: 15px;
            }

            .stat-card {
                padding: 15px;
            }

            .stat-value {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <!-- Login Modal -->
    <div id="login-overlay">
        <div class="login-box">
            <h2 style="color: var(--primary); margin-bottom: 30px;">Admin Login</h2>
            <input type="text" id="admin-id" placeholder="관리자 ID">
            <input type="password" id="admin-pw" placeholder="비밀번호">
            <button class="btn-primary" onclick="adminLogin()">Log In</button>
            <p id="login-error" style="color: #ef4444; margin-top: 15px; font-size: 0.9rem;"></p>
        </div>
    </div>

    <!-- Mobile Menu Overlay -->
    <div id="mobile-overlay" class="mobile-overlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <div class="logo">
            <i class="fas fa-gamepad"></i> AG Admin
        </div>
        <div class="nav-item active" onclick="showSection('dashboard')">
            <i class="fas fa-chart-line"></i> 대시보드
        </div>
        <div class="nav-item" onclick="showSection('users')">
            <i class="fas fa-users"></i> 유저 관리
        </div>
        <div class="nav-item" onclick="showSection('notice')">
            <i class="fas fa-bullhorn"></i> 공지사항 관리
        </div>
        <div class="nav-item" onclick="location.reload()" style="margin-top: auto; color: #94a3b8;">
            <i class="fas fa-sign-out-alt"></i> 로그아웃
        </div>
    </div>

    <div class="main-content" id="main-content">
        <!-- Dashboard Section -->
        <div id="dashboard" class="notice-section active-section">
            <div class="header">
                <button class="mobile-menu-toggle" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <h2>전체 현황</h2>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div style="color: #94a3b8;">총 가입자 수</div>
                    <div class="stat-value" id="total-users">0</div>
                </div>
                <div class="stat-card">
                    <div style="color: #94a3b8;">오늘 신규 유저</div>
                    <div class="stat-value">--</div>
                </div>
                <div class="stat-card">
                    <div style="color: #94a3b8;">서버 상태</div>
                    <div class="stat-value" style="color: #10b981;">Online</div>
                </div>
            </div>
        </div>

        <!-- User Management Section -->
        <div id="users" class="notice-section">
            <div class="header">
                <button class="mobile-menu-toggle" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <h2>유저 리스트</h2>
            </div>
            <div class="user-table-container">
                <table>
                    <thead>
                        <tr>
                            <th>유저 ID</th>
                            <th>닉네임</th>
                            <th>레벨</th>
                            <th>골드</th>
                            <th>가입일</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="user-list-body">
                        <!-- JS로 채워짐 -->
                    </tbody>
                </table>
            </div>
            <!-- Mobile User Cards -->
            <div class="mobile-user-cards" id="mobile-user-cards">
                <!-- JS로 채워짐 -->
            </div>
        </div>

        <!-- Notice Management Section -->
        <div id="notice" class="notice-section">
            <div class="header">
                <button class="mobile-menu-toggle" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <h2>공지사항 작성</h2>
            </div>
            <div class="stat-card" style="max-width: 600px;">
                <input type="text" id="notice-title" placeholder="제목을 입력하세요">
                <textarea id="notice-content" rows="10" placeholder="내용을 입력하세요"></textarea>
                <button class="btn-primary" onclick="postNotice()">공지 등록하기</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:3000";

        async function adminLogin() {
            const admin_id = document.getElementById('admin-id').value;
            const password = document.getElementById('admin-pw').value;
            const errorElement = document.getElementById('login-error');

            try {
                const response = await fetch(`${API_URL}/api/admin/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': '69420'
                    },
                    body: JSON.stringify({ admin_id, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // 로그인 성공 시 UI 전환
                    document.getElementById('login-overlay').style.display = 'none';
                    document.getElementById('sidebar').style.display = 'flex';
                    document.getElementById('main-content').style.display = 'block';
                    document.body.style.overflow = 'auto';
                    fetchUsers(); // 대시보드 데이터 로드
                } else {
                    errorElement.innerText = data.error || "로그인 실패";
                }
            } catch (err) {
                console.error(err);
                errorElement.innerText = "서버 연결 오류 (Localtunnel 확인 필요)";
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');

            sidebar.classList.toggle('show');
            overlay.classList.toggle('show');
        }

        function showSection(id) {
            document.querySelectorAll('.notice-section').forEach(s => s.classList.remove('active-section'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active-section');
            event.currentTarget.classList.add('active');

            // 모바일에서 사이드바 닫기
            if (window.innerWidth <= 768) {
                toggleSidebar();
            }

            if (id === 'users') fetchUsers();
        }

        async function fetchUsers() {
            try {
                const response = await fetch(`${API_URL}/api/admin/users`, {
                    headers: { 'ngrok-skip-browser-warning': '69420' }
                });

                if (!response.ok) {
                    throw new Error(`서버 응답 오류: ${response.status} ${response.statusText}`);
                }

                const users = await response.json();
                const tbody = document.getElementById('user-list-body');
                tbody.innerHTML = '';

                // users가 배열인지 확인
                if (!Array.isArray(users)) {
                    throw new Error('서버에서 잘못된 데이터 형식을 반환했습니다.');
                }

                document.getElementById('total-users').innerText = users.length;

                // 데스크톱 테이블
                const tbody = document.getElementById('user-list-body');
                tbody.innerHTML = '';

                // 모바일 카드 컨테이너
                const mobileCards = document.getElementById('mobile-user-cards');
                mobileCards.innerHTML = '';

                users.forEach(user => {
                    const isAdmin = user.is_admin === 1;
                    const adminBadge = isAdmin ? `<span style="background: #10b981; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.8em;">${user.admin_role || '관리자'}</span>` : '';

                    let actionButtons = '';

                    if (isAdmin) {
                        // 관리자인 경우: 권한 해제 버튼만 표시
                        actionButtons = `
                            <button class="action-btn" style="background: #f59e0b;" onclick="toggleAdmin(${user.id}, '${user.user_id}', 'revoke')">권한해제</button>
                        `;
                    } else {
                        // 일반 유저인 경우: 제재, 삭제, 권한부여 버튼 표시
                        actionButtons = `
                            <button class="action-btn" onclick="banUser(${user.id}, '${user.user_id}')">제재</button>
                            <button class="action-btn" style="background: #dc2626; margin-left: 5px;" onclick="deleteUser(${user.id}, '${user.user_id}')">삭제</button>
                            <button class="action-btn" style="background: #10b981; margin-left: 5px;" onclick="toggleAdmin(${user.id}, '${user.user_id}', 'grant')">관리자임명</button>
                        `;
                    }

                    // 데스크톱 테이블 행 생성
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${user.user_id || 'N/A'} ${adminBadge}</td>
                        <td>${user.nickname || 'N/A'}</td>
                        <td>Lv.${user.level || 1}</td>
                        <td>${user.gold || 0} G</td>
                        <td>${user.created_at ? new Date(user.created_at).toLocaleDateString() : 'N/A'}</td>
                        <td>${actionButtons}</td>
                    `;
                    tbody.appendChild(tr);

                    // 모바일 카드 생성
                    const card = document.createElement('div');
                    card.className = 'user-card';
                    card.innerHTML = `
                        <div class="user-card-header">
                            <h4>${user.user_id || 'N/A'} ${adminBadge}</h4>
                            <small>${user.created_at ? new Date(user.created_at).toLocaleDateString() : 'N/A'}</small>
                        </div>
                        <div class="user-card-info">
                            <div><span>닉네임:</span> <span>${user.nickname || 'N/A'}</span></div>
                            <div><span>레벨:</span> <span>Lv.${user.level || 1}</span></div>
                            <div><span>골드:</span> <span>${user.gold || 0} G</span></div>
                            <div><span>상태:</span> <span>${isAdmin ? '관리자' : '일반유저'}</span></div>
                        </div>
                        <div class="user-card-actions">
                            ${actionButtons}
                        </div>
                    `;
                    mobileCards.appendChild(card);
                });
            } catch (err) {
                console.error('사용자 목록 로드 실패:', err);
                // 사용자에게 에러 표시
                const tbody = document.getElementById('user-list-body');
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align: center; color: #ef4444; padding: 40px;">
                            <i class="fas fa-exclamation-triangle"></i><br>
                            사용자 목록을 불러올 수 없습니다.<br>
                            <small>${err.message}</small>
                        </td>
                    </tr>
                `;
                document.getElementById('total-users').innerText = '오류';
            }
        }

        async function postNotice() {
            const title = document.getElementById('notice-title').value;
            const content = document.getElementById('notice-content').value;

            if (!title || !content) return alert("제목과 내용을 입력하세요.");

            try {
                const response = await fetch(`${API_URL}/api/admin/notices`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': '69420'
                    },
                    body: JSON.stringify({ title, content })
                });
                const data = await response.json();
                alert(data.message);
                document.getElementById('notice-title').value = '';
                document.getElementById('notice-content').value = '';
            } catch (err) {
                console.error(err);
                alert("등록 실패");
            }
        }

        async function banUser(userId, userIdStr) {
            if (!confirm(`사용자 "${userIdStr}"을(를) 제재하시겠습니까?\n(현재는 UI만 구현되어 있습니다)`)) {
                return;
            }
            // TODO: 제재 API 구현
            alert("제재 기능은 추후 구현 예정입니다.");
        }

        async function deleteUser(userId, userIdStr) {
            if (!confirm(`정말로 사용자 "${userIdStr}"을(를) 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다!`)) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/admin/users/delete/${userId}`, {
                    method: 'GET',
                    headers: { 'ngrok-skip-browser-warning': '69420' }
                });

                if (!response.ok) {
                    throw new Error(`삭제 실패: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                alert(data.message || "사용자가 성공적으로 삭제되었습니다.");
                fetchUsers(); // 목록 새로고침
            } catch (err) {
                console.error('사용자 삭제 실패:', err);
                alert(`사용자 삭제에 실패했습니다: ${err.message}`);
            }
        }

        async function toggleAdmin(userId, userIdStr, action) {
            const actionText = action === 'grant' ? '부여' : '해제';
            const confirmText = action === 'grant'
                ? `사용자 "${userIdStr}"에게 관리자 권한을 ${actionText}하시겠습니까?`
                : `사용자 "${userIdStr}"의 관리자 권한을 ${actionText}하시겠습니까?`;

            if (!confirm(confirmText)) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/admin/users/${userId}/toggle-admin`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': '69420'
                    },
                    body: JSON.stringify({ action })
                });

                if (!response.ok) {
                    throw new Error(`${actionText} 실패: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                alert(data.message || `관리자 권한이 성공적으로 ${actionText}되었습니다.`);
                fetchUsers(); // 목록 새로고침
            } catch (err) {
                console.error(`관리자 권한 ${actionText} 실패:`, err);
                alert(`관리자 권한 ${actionText}에 실패했습니다: ${err.message}`);
            }
        }
    </script>
</body>

</html>
