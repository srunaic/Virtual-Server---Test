<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Virtual Server</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--card-bg);
            border-right: 1px solid #334155;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item {
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .nav-item:hover,
        .nav-item.active {
            background: var(--primary);
            color: white;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #334155;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            margin: 10px 0;
        }

        /* Table */
        .user-table-container {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #334155;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 15px;
            color: #94a3b8;
            font-weight: 500;
            border-bottom: 1px solid #334155;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #334155;
        }

        .action-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Notice Modal (Simple) */
        .notice-section {
            display: none;
        }

        .active-section {
            display: block;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
        }

        button.btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="logo">
            <i class="fas fa-gamepad"></i> AG Admin
        </div>
        <div class="nav-item active" onclick="showSection('dashboard')">
            <i class="fas fa-chart-line"></i> 대시보드
        </div>
        <div class="nav-item" onclick="showSection('users')">
            <i class="fas fa-users"></i> 유저 관리
        </div>
        <div class="nav-item" onclick="showSection('notice')">
            <i class="fas fa-bullhorn"></i> 공지사항 관리
        </div>
    </div>

    <div class="main-content">
        <!-- Dashboard Section -->
        <div id="dashboard" class="notice-section active-section">
            <div class="header">
                <h2>전체 현황</h2>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div style="color: #94a3b8;">총 가입자 수</div>
                    <div class="stat-value" id="total-users">0</div>
                </div>
                <div class="stat-card">
                    <div style="color: #94a3b8;">오늘 신규 유저</div>
                    <div class="stat-value">--</div>
                </div>
                <div class="stat-card">
                    <div style="color: #94a3b8;">서버 상태</div>
                    <div class="stat-value" style="color: #10b981;">Online</div>
                </div>
            </div>
        </div>

        <!-- User Management Section -->
        <div id="users" class="notice-section">
            <div class="header">
                <h2>유저 리스트</h2>
            </div>
            <div class="user-table-container">
                <table>
                    <thead>
                        <tr>
                            <th>유저 ID</th>
                            <th>닉네임</th>
                            <th>레벨</th>
                            <th>골드</th>
                            <th>가입일</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="user-list-body">
                        <!-- JS로 채워짐 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Notice Management Section -->
        <div id="notice" class="notice-section">
            <div class="header">
                <h2>공지사항 작성</h2>
            </div>
            <div class="stat-card" style="max-width: 600px;">
                <input type="text" id="notice-title" placeholder="제목을 입력하세요">
                <textarea id="notice-content" rows="10" placeholder="내용을 입력하세요"></textarea>
                <button class="btn-primary" onclick="postNotice()">공지 등록하기</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://fluffy-apes-create.loca.lt";

        function showSection(id) {
            document.querySelectorAll('.notice-section').forEach(s => s.classList.remove('active-section'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active-section');
            event.currentTarget.classList.add('active');

            if (id === 'users') fetchUsers();
        }

        async function fetchUsers() {
            try {
                const response = await fetch(`${API_URL}/api/admin/users`);
                const users = await response.json();
                const tbody = document.getElementById('user-list-body');
                tbody.innerHTML = '';

                document.getElementById('total-users').innerText = users.length;

                users.forEach(user => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${user.user_id}</td>
                        <td>${user.nickname}</td>
                        <td>Lv.${user.level}</td>
                        <td>${user.gold} G</td>
                        <td>${new Date(user.created_at).toLocaleDateString()}</td>
                        <td><button class="action-btn">제재</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function postNotice() {
            const title = document.getElementById('notice-title').value;
            const content = document.getElementById('notice-content').value;

            if (!title || !content) return alert("제목과 내용을 입력하세요.");

            try {
                const response = await fetch(`${API_URL}/api/admin/notices`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, content })
                });
                const data = await response.json();
                alert(data.message);
                document.getElementById('notice-title').value = '';
                document.getElementById('notice-content').value = '';
            } catch (err) {
                console.error(err);
                alert("등록 실패");
            }
        }

        // 초기 데이터 로드
        fetchUsers();
    </script>
</body>

</html>
